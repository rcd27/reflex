[package]
name = "reflex-windivert"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Носитель WinDivert для reflex — свидетель формы фасада на второй ОС, не свидетель работы"

# Член воркспейса, хотя на Linux крейт пуст: исключённый отставал бы от фундамента молча, а этот
# собирается тем же `cargo build --workspace`, что и всё прочее.
[dependencies]
reflex-core = { path = "../core" }
reflex-instrument = { path = "../instrument" }

# Фасад нужен только носителю под Windows (`carrier.rs` под `cfg(windows)`); `witness.rs` собирается на
# любой платформе и потому границу способностей воспроизводит своим кодом, а не импортом `Act`.
[target.'cfg(windows)'.dependencies]
reflex = { path = "../reflex" }
