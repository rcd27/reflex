[package]
name = "reflex-windivert"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Носитель WinDivert для reflex — свидетель ФОРМЫ фасада на второй ОС, не свидетель работы (Task 12)"

# ЧЛЕН ВОРКСПЕЙСА, А НЕ ИСКЛЮЧЁННЫЙ (решение контроллера, 10.09.2026): пустой крейт на Linux ВИДЕН
# и собирается тем же `cargo build --workspace`, что и всё прочее; исключённый гнил бы молча, и
# никто не заметил бы, что он отстал от Tasks 3-10 фундамента.
#
# ЗАВИСИМОСТЬ ОТ `reflex-core`, А НЕ ОТ ФАСАДА `reflex` — НАЙДЕНО ПРОГОНОМ, НЕ ВЫБРАНО ЗАРАНЕЕ:
# `IntoCarrier` живёт в `reflex`, но `cargo check -p reflex --target x86_64-pc-windows-msvc` падает
# СЕГОДНЯ и без WinDivert (23 ошибки в `nfq` крейте, зависимость `reflex-linux`, которую `reflex`
# тянет безусловно — подробности и цитата отказа в докблоке `src/lib.rs`). `reflex-core`
# кросс-проверяется чисто (замерено тем же способом), и весь контракт, который нужен ЭТОМУ крейту
# (`Serves`, `Terminal`, `Edging`, способности, `Local`), лежит именно там. `reflex-instrument`
# нужен только за `Layout` (форма марки, независимая от того, ГДЕ она хранится физически) и тоже
# кросс-проверяется чисто (замерено).
#
# ГЕЙТ ПО МОДУЛЯМ, НЕ ПО ЗАВИСИМОСТЯМ: весь реальный FFI (`WinDivertOpen`/`Recv`/`Send`/`Close`,
# Win32-примитивы ожидания) написан СВОИМИ `extern "system"`-блоками (докблок `src/ffi.rs` — та же
# причина, по которой `linux`-крейт пишет свой сокет к очереди вместо стороннего `nfq`), а не
# сторонним крейтом-обёрткой — ни одной платформенной ЗАВИСИМОСТИ здесь нет, и
# `target.'cfg(windows)'.dependencies` заводить незачем. Граница платформы идёт по `#[cfg(windows)]`
# на объявлениях `extern` в `src/ffi.rs` и на `mod carrier;` в `src/lib.rs` — на Linux эти пути
# просто не существуют, и `cargo build --workspace` их не видит.

[dependencies]
reflex-core = { path = "../core" }
reflex-instrument = { path = "../instrument" }
