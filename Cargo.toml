[workspace]
resolver = "2"
members = [
    "core",
    "runtime",
    "linux",
    "linux-common",
    "os",
    # ПРИБОРЫ — ПАСПОРТ РАЗЛИЧАЮЩЕЙ СПОСОБНОСТИ (приехал 06.09.2026 из продукта, #326).
    #
    # Крейт зависел ровно от `reflex-core` и ни от чего продуктового — то есть был фундаментным по
    # построению и лежал не там, где живёт. Что он знает: сброс, тишина, троттлинг, повтор без
    # ответа, судьба соединения, доверие к цели, словарь провода. Всё это понятия ВСЯКОГО движка в
    # разрыве, а не нашего продукта.
    #
    # История файлов осталась в суперпроекте (`rcd27/nevod`, до `7985d309` включительно): переезд
    # между репозиториями её не переносит, и притворяться, будто переносит, незачем.
    "instrument",
    # ДВИЖОК В РАЗРЫВЕ (приехал 06.09.2026 из продукта, #326) — то, ради чего затевался перенос.
    #
    # `engine` — ядро: курсор разговора, счёт байтов по окну, момент раскрытия личности, выпуск из
    # горячего пути. `engine-nfq` — оболочка над очередью ядра: разбор провода, таблица
    # разговоров, память о разговоре ради наблюдения, сверка нашего счёта со счётом ядра.
    #
    # РАЗРЕЗ БЫЛ СДЕЛАН ДО ПЕРЕЕЗДА: приборы, читавшие счётчики НАШЕЙ схемы правил и `/proc`
    # конкретного чужого бинаря, остались наверху (`nevod2-runtime::kernel`). Взять папку целиком
    # значило бы увезти в общий фундамент адаптер к zapret и имя нашей таблицы.
    #
    # История файлов осталась в суперпроекте (`rcd27/nevod`, по `50afa25c` включительно).
    "engine",
    "engine-nfq",
    # ФАСАД — единственная дверь фреймворка (`engine(X).from…`). Прячет всё выше.
    "reflex",
    # ПРИМЕРЫ — эталон использования, один use-case на подпапку. Тест готовности API: если
    # примеру нужно что-то, кроме `reflex`, — дефект фасада, а не примера.
    "examples/detect-silent-drop",
    "examples/detect-syn-drop",
    "examples/detect-dns-poisoning",
    "examples/sever-silent-drop",
]
# linux-ebpf is NOT a workspace member — it compiles to BPF target separately
