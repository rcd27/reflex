[package]
name = "reflex-engine-nfq"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Оболочка движка над очередью ядра: разбор провода, таблица разговоров, сверка счетов"

# ОТДЕЛЬНЫЙ КРЕЙТ, А НЕ МОДУЛЬ ЯДРА — граница проходит по знанию о ЯДРЕ.
#
# `reflex-engine` не знает ни netfilter, ни conntrack: он рассуждает о разговоре и отдаёт решение
# значением. Здесь же живёт всё, что требует Linux, — и потому этот крейт зависит от
# `reflex-linux`, а ядро движка не зависит ни от чего, кроме типов.
#
# ЧЕГО ЗДЕСЬ БОЛЬШЕ НЕТ (разрез перед переездом, #326): приборы, читавшие счётчики НАШЕЙ схемы
# правил (`nft`-таблица с известным именем) и `/proc` конкретного чужого бинаря (`nfqws2` из
# zapret), уехали наверх в `nevod2-runtime::kernel`. Разрез оказался чистым: у вынесенного не было
# ни одного потребителя в продуктовом пути.
[dependencies]
reflex-instrument = { path = "../instrument" }
reflex-engine = { path = "../engine" }
reflex-core = { path = "../core" }
reflex-linux = { path = "../linux", features = ["nfqueue", "conntrack"] }
