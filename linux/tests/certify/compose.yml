# СЕРТИФИКАЦИЯ КАЛИТКИ: подопытный и свидетель в РАЗНЫХ контейнерах.
#
# Свидетель в чужом сетевом пространстве — не церемония. Стой он рядом с подопытным, он заверял бы
# «кадр дошёл до точки съёма ядра», а не «кадр дошёл»: свидетель не на той границе заверяет
# технику, которой дальше не было.
#
# Оба на одной сети docker; подопытный шлёт широковещательный кадр со своим ethertype (0x88B5,
# опытный диапазон IEEE) — чужой стек его не разбирает и не отвечает, значит ничей трафик не
# задет, а кадр по дороге не переписан.
#
# КАНОН ЗАИМСТВОВАНИЯ СВИДЕТЕЛЯ (`dumpcap`/libpcap) опубликован в #326 по пяти осям
# (issuecomment-5551796154). Главная названная цена: на Linux libpcap работает через тот же
# `PF_PACKET`, что и `AfPacketBackend`, — дефект самого механизма ядра оба увидят одинаково, и
# закон пройдёт вакуумно. Второй прибор иной природы — следующий срез.

name: reflex-certify

# ОДНО УСТРОЙСТВО, ДВЕ РОЛИ. Общая часть вынесена якорем, а не переиспользованием собранного
# образа: так в файле прямо сказано, что подопытный и свидетель суть один и тот же мир, и роль
# задаётся КОМАНДОЙ. Две сборки из одного контекста дают одинаковое содержимое, то есть второй
# правды о проверяемом коде не заводится.
x-device: &device
  build:
    context: ../../..
    dockerfile: linux/tests/certify/Dockerfile
  # NET_RAW — минимум, которым живут и захват, и инъекция. NET_ADMIN не даём НИ ОДНОМУ: если закон
  # держится без него, тем самым установлено, что калитка не опирается на netfilter тайком.
  cap_add: [NET_RAW]
  volumes:
    - shared:/shared
  networks: [segment]

services:
  # СВИДЕТЕЛЬ. Пишет всё, что видит, в общий том; вердикта не выносит — его дело показания.
  witness:
    <<: *device
    container_name: certify-witness
    command:
      - sh
      - -c
      # `-P` — КЛАССИЧЕСКИЙ PCAP, А НЕ PCAPNG. По умолчанию `dumpcap` пишет pcapng, и наш читатель
      # (`reflex_core::pcap`) разбирает классический формат намеренно: тридцать лет стабильности
      # против зависимости ради сорока строк.
      #
      # Найдено первым же живым прогоном, и найдено ХОРОШО: читатель сказал
      # `NotPcap { magic: 0x0A0D0D0A }` и объявил прогон НЕДЕЙСТВИТЕЛЬНЫМ, а не чистым. Молчаливое
      # «кадров ноль» здесь было бы неотличимо от «подопытный солгал».
      # ФИЛЬТР ЛОВИТ ДВОЕ: предмет и МАЯК. Один опытный ethertype сужал видимое до кадров
      # подопытного, и при лживом бэкенде запись оказывалась пуста — «прибор мёртв» становилось
      # неотличимо от «подопытный солгал». Маяк (широковещательная датаграмма на порт `discard`)
      # строится ЯДРОМ, а не проверяемым бэкендом, и потому доходит независимо от его исправности.
      - "certify-snif -P -i eth0 -w /shared/far.pcap -f 'ether proto 0x88b5 or udp port 9 or udp port 5333'"

  # ПОДОПЫТНЫЙ. Единственный, кто что-то утверждает: вердикт считает он и печатает строкой JSON.
  dut:
    <<: *device
    container_name: certify-dut
    depends_on: [witness]
    command: ["sleep", "infinity"]

  # ОЧЕРЕДЬ ЯДРА — ЕДИНСТВЕННЫЙ БЭКЕНД, НА КОТОРОМ РАБОТАЕТ ПРОДУКТ, и потому у неё СВОЙ образ.
  #
  # Соседи собраны из минимального: отсутствие в них `nft` есть отрицательное свидетельство того,
  # что `AfPacketBackend` обходится заявленным. Очереди netfilter нужен по природе — без правила,
  # заворачивающего пакет, удерживать нечего, — и `NET_ADMIN` даётся ТОЛЬКО ей. Граница между
  # «обходится сама» и «требует ядра» проходит по границе образов, а не по честному слову.
  queue:
    build:
      context: ../../..
      dockerfile: linux/tests/certify/Dockerfile.queue
    container_name: certify-queue
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - shared:/shared
    networks: [segment]
    depends_on: [witness]
    command:
      - sh
      - -c
      # ПРАВИЛО СТАВИТСЯ ЗДЕСЬ, А НЕ В БИНАРЕ, и это разделение по существу: `nft` — часть МИРА, а
      # не подопытный. Закон проверяет не то, умеем ли мы звать чужую утилиту, а ждёт ли ядро
      # нашего решения.
      #
      # `output` намеренно: пакет заворачивается ДО того, как покинет машину, поэтому подопытный
      # может породить его сам — а прошёл ли он, знает только сосед в чужом netns.
      #
      # ЧИТАТЕЛЬ МЕТКИ СТОИТ НИЖЕ ОЧЕРЕДИ, и в этом весь смысл: `postrouting` с приоритетом 100
      # проходится ПОСЛЕ `output` с приоритетом 0. Пакет продолжает обход с места, где его забрали,
      # поэтому читатель, поставленный выше, метку не увидит никогда — а прибор покажет «решение
      # принято». Ровно эту граблю и проверяет закон метки.
      - "nft add table inet certify &&
         nft 'add chain inet certify out { type filter hook output priority 0; }' &&
         nft add rule inet certify out udp dport 5333 queue num 0 &&
         nft 'add chain inet certify post { type filter hook postrouting priority 100; }' &&
         nft add rule inet certify post meta mark 0x2a counter &&
         sleep infinity"

networks:
  # Обычная сеть, не `internal`: при `internal` хозяин дропает трафик, и сегмент не видит ничего
  # (оплачено в лабе двенадцатью убитыми пакетами).
  segment:
    name: reflex-certify-seg

volumes:
  # ЗАПИСЬ СВИДЕТЕЛЯ — ЕДИНСТВЕННЫЙ КАНАЛ МЕЖДУ РОЛЯМИ. Не сокет и не сеть: показания обязаны
  # пережить контейнер, который их снял, иначе прогон нельзя перепроверить.
  shared:
