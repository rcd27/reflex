[package]
name = "reflex-linux"
version = "0.0.1"
edition = "2021"
description = "AF_PACKET and TC-BPF backends for reflex"
license = "GPL-3.0-only"

[features]
default = []
# certify: сертификация калитки на живом ядре. Тянет чтение записи (`reflex-core/pcap`) — свидетелем
# служит `tshark`, и его вывод надо уметь прочитать — и `nfqueue`, потому что закон удержания
# проверяет ИМЕННО очередь: она единственный бэкенд, на котором работает продукт. Под фичей, потому
# что нужна ровно устройству, а не всякому потребителю библиотеки.
certify = ["reflex-core/pcap", "nfqueue"]
tc = ["dep:aya", "dep:reflex-linux-common"]
nfqueue = ["dep:nfq"]
# conntrack: чтение счётчиков ядра по каждому разговору через ctnetlink. Зависимостей сверх `libc`
# нет намеренно: дверь узкая (один дамп-запрос), а крейты netlink тянут рантайм ради того же.
conntrack = []
# tun: userspace-терминация TCP из tun-устройства в async-потоки с ОРИГИНАЛЬНЫМ dst. СВОИ обёртки над
# движком smoltcp (проекция model/wire/TransparentCapture.tla): `tun_listen` (входящие, passive-open) +
# `tun_egress` (originate, active-open, `EgressIdentity`/`SteerDatapath` L2Glue). netstack-smoltcp срезан
# (#74) — буфер/lifecycle/backpressure сокета были вне юрисдикции → утечку не локализовать.
tun = ["dep:smoltcp", "dep:spin"]

[dependencies]
reflex-core = { path = "../core", features = ["tls"] }
nfq = { version = "0.2", optional = true }
tracing = "0.1"
futures = "0.3"
# ФИЧА `process` СНЯТА ВМЕСТЕ С `nfqws` (05.09.2026): она стояла ради запуска чужого движка
# обхода, и после его выноса в дереве не осталось ни одного `tokio::process`.
tokio = { version = "1", features = ["time", "sync", "rt", "rt-multi-thread", "io-util", "net"] }
libc = "0.2"
aya = { version = "0.13", optional = true }
reflex-linux-common = { path = "../linux-common", optional = true }
# СВОИ обёртки (`tun_listen`/`tun_egress`) держат netstack на движке smoltcp напрямую (passive+active
# open). medium-ip: tun даёт сырой IP, L2 клеит eBPF (не netstack). Один движок, обёртка в нашей юрисдикции.
smoltcp = { version = "0.12", optional = true, default-features = false, features = [
  "std", "medium-ip", "proto-ipv4", "socket-tcp",
] }
spin = { version = "0.9", optional = true } # SpinMutex общего control'а сокета (sync poll-луп ↔ async-стрим)

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.9"
tokio = { version = "1", features = ["time", "sync", "rt", "rt-multi-thread", "macros", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# СЕРТИФИКАЦИЯ КАЛИТКИ. Пример, а не тест: он требует живого ядра и прав, то есть УСТРОЙСТВА, и
# `cargo test` его запускать не должен — иначе на машине без прав он краснел бы, ничего не проверив.
[[example]]
name = "certify"
path = "examples/certify.rs"
required-features = ["certify"]

[[example]]
name = "l2_steer"
path = "examples/l2_steer.rs"
required-features = ["tc"]

[[example]]
name = "nfq-passthrough"
path = "examples/nfq-passthrough.rs"
required-features = ["nfqueue"]

[[example]]
name = "nfq-fragment"
path = "examples/nfq-fragment.rs"
required-features = ["nfqueue"]

[[example]]
name = "ct-dump"
path = "examples/ct-dump.rs"
required-features = ["conntrack"]
