[package]
name = "reflex-linux"
version = "0.1.0"
edition = "2021"
description = "AF_PACKET backend for reflex"
license = "GPL-3.0-only"

[dependencies]
reflex-core = { path = "../core" }
futures = "0.3"
tokio = { version = "1", features = ["time", "sync", "rt", "rt-multi-thread"] }
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["time", "sync", "rt", "rt-multi-thread", "macros", "test-util"] }
