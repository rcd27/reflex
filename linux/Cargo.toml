[package]
name = "reflex-linux"
version = "0.0.1"
edition = "2021"
description = "AF_PACKET and TC-BPF backends for reflex"
license = "GPL-3.0-only"

[features]
default = []
tc = ["dep:aya", "dep:reflex-linux-common"]
nfqueue = ["dep:nfq"]
# tun: userspace-терминация TCP из tun-устройства в async-потоки с ОРИГИНАЛЬНЫМ dst (netstack на
# движке smoltcp). Субстрат данных, потребляемый неводом (проекция model/wire/TransparentCapture.tla).
# `smoltcp`/`spin` — прямые: originate-нога (`tun_egress`) держит СВОЙ netstack исходящих сокетов
# (netstack-smoltcp только listen'ит, active-open в нём нет), проекция `EgressIdentity`/`SteerDatapath` L2Glue.
tun = ["dep:netstack-smoltcp", "dep:tokio-util", "dep:smoltcp", "dep:spin"]

[dependencies]
reflex-core = { path = "../core", features = ["tls"] }
nfq = { version = "0.2", optional = true }
tracing = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["time", "sync", "rt", "rt-multi-thread", "process", "io-util", "net"] }
thiserror = "2"
libc = "0.2"
aya = { version = "0.13", optional = true }
reflex-linux-common = { path = "../linux-common", optional = true }
netstack-smoltcp = { version = "0.1.4", optional = true } # tun→async-stream, движок smoltcp 0.12
tokio-util = { version = "0.7", features = ["compat"], optional = true } # futures↔tokio AsyncRead мост
# originate-нога держит СВОЙ netstack (active-open) — smoltcp напрямую, тот же движок/версия, что тянет
# netstack-smoltcp (одна копия в дереве). medium-ip: tun даёт сырой IP, L2 клеит eBPF (не netstack).
smoltcp = { version = "0.12", optional = true, default-features = false, features = [
  "std", "medium-ip", "proto-ipv4", "socket-tcp",
] }
spin = { version = "0.9", optional = true } # SpinMutex общего control'а сокета (sync poll-луп ↔ async-стрим)

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.9"
tokio = { version = "1", features = ["time", "sync", "rt", "rt-multi-thread", "macros", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[[example]]
name = "l2_steer"
path = "examples/l2_steer.rs"
required-features = ["tc"]

[[example]]
name = "nfq-passthrough"
path = "examples/nfq-passthrough.rs"
required-features = ["nfqueue"]

[[example]]
name = "nfq-fragment"
path = "examples/nfq-fragment.rs"
required-features = ["nfqueue"]
