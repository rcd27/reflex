[package]
name = "reflex-linux"
version = "0.0.1"
edition = "2021"
description = "AF_PACKET and TC-BPF backends for reflex"
license = "GPL-3.0-only"

[features]
default = []
tc = ["dep:aya", "dep:reflex-linux-common"]
nfqueue = ["dep:nfq"]

[dependencies]
reflex-core = { path = "../core", features = ["tls"] }
nfq = { version = "0.2", optional = true }
tracing = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["time", "sync", "rt", "rt-multi-thread"] }
libc = "0.2"
aya = { version = "0.13", optional = true }
reflex-linux-common = { path = "../linux-common", optional = true }

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.9"
tokio = { version = "1", features = ["time", "sync", "rt", "rt-multi-thread", "macros", "test-util"] }

[[example]]
name = "nfq-passthrough"
path = "examples/nfq-passthrough.rs"
required-features = ["nfqueue"]

[[example]]
name = "nfq-fragment"
path = "examples/nfq-fragment.rs"
required-features = ["nfqueue"]

[[example]]
name = "nfq-trial"
path = "examples/nfq-trial.rs"
required-features = ["nfqueue"]
