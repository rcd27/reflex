# Проверки, которые проходят СЕГОДНЯ и потому поставлены обязательными.
#
# Здесь нет `fmt` и `clippy`, и это названо нарочно, а не забыто: на 10.09.2026 `cargo fmt --check`
# даёт расхождения, `cargo clippy` — 26 замечаний. Поставить их зелёными значило бы завести
# проверку, которая красная с первого дня, — а к красной проверке привыкают и перестают читать.
# Их включение — отдельная работа: сперва чистка, потом обязательство.
#
# Кросс-сборка под Windows стоит здесь не для поддержки Windows, а как ЕДИНСТВЕННЫЙ проверяемый
# критерий переносимости: соберётся фасад под чужую платформу — значит Linux не протёк в цепочку.
# Грепом это мерить нельзя, он мерит отсутствие ИМЕНИ, а предмет — отсутствие ЗАВИСИМОСТИ.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: тесты дерева
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Привилегий не требует: боевые стенды живут отдельно (`examples/*/lab/`) и в CI не гоняются —
      # им нужен реальный ТСПУ, которого у раннера нет. Здесь проверяется дерево, а не мир.
      - run: cargo test --workspace
      # ЧЕРНОВАЯ ДВЕРЬ ЗА ФИЧЕЙ (`telling`) гоняется ОТДЕЛЬНЫМ шагом: `--workspace` чужих фич не
      # включает, и дверь, не попавшая в прогон, тихо сгнила бы — ровно как сгнила четвёртая дверь
      # шва, простоявшая построенной и ни разу не позванной.
      - run: cargo test -p reflex --features telling
      # ТРАНСПОРТ QUIC — та же причина, что у `telling`: фича не в умолчании (тянет `ring`), и без
      # отдельного шага прогон её не видит вовсе.
      - run: cargo test -p reflex --features quic

  portable:
    name: фасад не знает Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p reflex --target x86_64-pc-windows-msvc

  library:
    name: парк годен без носителя
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # ПАРК ПРИБОРОВ ГОДЕН КАК ЧИСТАЯ БИБЛИОТЕКА — без носителя, без ядра, без прав. На это
      # свойство УЖЕ опирается поставка: потребитель собрал приборы под девять целей, включая
      # mips64 и riscv64, и гоняет их над наблюдениями из обычного сокета. Свойство держится
      # РАЗРЕЗОМ (крейт зависит ровно от `reflex-core`), а разрез ничем не охранялся: одна строка в
      # манифесте — и поставка ломается молча, у чужих людей, на чужом железе.
      - name: в парке нет ни носителя, ни платформы
        run: |
          if cargo tree -p reflex-instrument --edges normal \
             | grep -E '(nfq|ring|tokio|reflex-linux|reflex-engine|reflex-runtime) v'; then
            echo "в дереве парка появился носитель или рантайм — разрез сломан" >&2
            exit 1
          fi
      # Сборка под чужую архитектуру: `check` не линкует, потому тулчейна C не нужно. Грепом это
      # мерить нельзя — он мерит отсутствие ИМЕНИ, а предмет есть отсутствие ЗАВИСИМОСТИ.
      - run: cargo check -p reflex-instrument --target riscv64gc-unknown-linux-gnu

  docs:
    name: документация собирается
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `deny(rustdoc::broken_intra_doc_links)` стоит в крейтах: обещание ИМЕНИ в докблоке держит
      # компилятор, а не читатель. Здесь это обещание и проверяется.
      - run: cargo doc --workspace --no-deps
