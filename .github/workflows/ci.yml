# Проверки, которые проходят СЕГОДНЯ и потому поставлены обязательными.
#
# Здесь нет `fmt` и `clippy`, и это названо нарочно, а не забыто: на 10.09.2026 `cargo fmt --check`
# даёт расхождения, `cargo clippy` — 26 замечаний. Поставить их зелёными значило бы завести
# проверку, которая красная с первого дня, — а к красной проверке привыкают и перестают читать.
# Их включение — отдельная работа: сперва чистка, потом обязательство.
#
# Кросс-сборка под Windows стоит здесь не для поддержки Windows, а как ЕДИНСТВЕННЫЙ проверяемый
# критерий переносимости: соберётся фасад под чужую платформу — значит Linux не протёк в цепочку.
# Грепом это мерить нельзя, он мерит отсутствие ИМЕНИ, а предмет — отсутствие ЗАВИСИМОСТИ.
#
# Тем же доводом стоит `дверь замкнута`: замок фасада — свойство ПОДПИСЕЙ, а греп видит пути. На
# 18.09.2026 он показывал одну течь из двадцати четырёх (остальные приезжали приватным `use`), и
# наш собственный носитель из чужого крейта всё это время писался второй зависимостью.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: тесты дерева
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Стенды на реальном трафике живут отдельно (`examples/*/lab/`) и в CI не гоняются — им нужен реальный ТСПУ,
      # которого у раннера нет. Здесь проверяется дерево, а не мир.
      #
      # СВОЁ СЕТЕВОЕ ПРОСТРАНСТВО всё же нужно: три витнеса ядра (`os/tests/netlink_link_event.rs`,
      # `linux/tests/steer_path.rs`, `reflex/tests/steer_gate.rs`) переисполняют себя под
      # `unshare -Ur --net`. Ubuntu 24.04 запрещает это непривилегированному процессу через AppArmor
      # (`unshare: write failed /proc/self/uid_map: Operation not permitted`), и CI был красным с
      # первого прогона 10.09.2026 — а за упавшим первым бинарником `telling` и `quic` ниже не
      # запускались НИ РАЗУ. Запрет снимается на раннере, а не в тестах: пропуск при отказе
      # `unshare` превратил бы витнес в украшение, и зелёный прогон ничего бы не свидетельствовал.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo test --workspace
      # ЧЕРНОВАЯ ДВЕРЬ ЗА ФИЧЕЙ (`telling`) гоняется ОТДЕЛЬНЫМ шагом: `--workspace` чужих фич не
      # включает, и дверь, не попавшая в прогон, тихо сгнила бы — ровно как сгнила четвёртая дверь
      # шва, простоявшая построенной и ни разу не позванной.
      - run: cargo test -p reflex --features telling
      # ТРАНСПОРТ QUIC — та же причина, что у `telling`: фича не в умолчании (тянет `ring`), и без
      # отдельного шага прогон её не видит вовсе.
      - run: cargo test -p reflex --features quic

  portable:
    name: фасад не знает Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p reflex --target x86_64-pc-windows-msvc

  closed:
    name: дверь замкнута
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # НОЧНОЙ ТУЛЧЕЙН — единственной причиной: дерево предметов в машинном виде отдаёт только он.
      # Стабильный даёт HTML, по которому пришлось бы грепать, то есть ровно тот замер, от которого
      # сторож и заведён.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/facade-closure.sh

  library:
    name: парк годен без носителя
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # ПАРК ПРИБОРОВ ГОДЕН КАК ЧИСТАЯ БИБЛИОТЕКА — без носителя, без ядра, без прав. На это
      # свойство УЖЕ опирается поставка: потребитель собрал приборы под девять целей, включая
      # mips64 и riscv64, и гоняет их над наблюдениями из обычного сокета. Свойство держится
      # РАЗРЕЗОМ (крейт зависит ровно от `reflex-core`), а разрез ничем не охранялся: одна строка в
      # манифесте — и поставка ломается молча, у чужих людей, на чужом железе.
      - name: в парке нет ни носителя, ни платформы
        run: |
          if cargo tree -p reflex-instrument --edges normal \
             | grep -E '(nfq|ring|tokio|reflex-linux|reflex-engine|reflex-runtime) v'; then
            echo "в дереве парка появился носитель или рантайм — разрез сломан" >&2
            exit 1
          fi
      # Сборка под чужую архитектуру: `check` не линкует, потому тулчейна C не нужно. Грепом это
      # мерить нельзя — он мерит отсутствие ИМЕНИ, а предмет есть отсутствие ЗАВИСИМОСТИ.
      - run: cargo check -p reflex-instrument --target riscv64gc-unknown-linux-gnu

  atomics64:
    name: фундамент годен без 64-битных атомиков
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: powerpc-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # ОТДЕЛЬНАЯ ЗАДАЧА, А НЕ ШАГ В «парк годен без носителя», и разница не косметическая: та
      # задача про РАЗРЕЗ (нет ли в графе носителя), эта — про НАБОР АТОМИКОВ у цели. Один предмет
      # — один закон; слить их значило бы, что падение одного читается как другое.
      #
      # ИМЯ КЛАССА — «нет 64-битных атомиков», а НЕ «32 бита», и первая редакция этой задачи звала
      # его вторым. Замер по девяти целям потребителя (12.09.2026): у `i586` и `arm` разрядность 32,
      # а `target_has_atomic="64"` ЕСТЬ. Класс, уронивший релиз, — ровно {mips, mipsel, ppc}. Назови
      # его разрядностью — и следующий возьмёт «какую-нибудь 32-битную» цель, а задача останется
      # зелёной, ничего не проверяя. Скрипт теперь отказывается работать на цели вне класса
      # (код 2), так что ошибиться молча нельзя.
      #
      # ЗАВЕДЕНА 12.09.2026 ПО ЦЕНЕ В МИРЕ. `AtomicU64` в тестовом дубле `TestClock` ронял весь
      # `reflex-core` на целях без 64-битных атомиков, и релиз потребителя вышел с шестью архивами
      # вместо девяти: `mips`, `mipsel`, `powerpc` отвалились. Для него это роутеры OpenWrt, то
      # есть основная аудитория, а не экзотика.
      #
      # ПОЧЕМУ СУЩЕСТВОВАВШАЯ ПРОВЕРКА ЭКЗОТИКИ ЭТОГО НЕ ЛОВИЛА — стоит знать, потому что она
      # выглядела покрытием. Задача выше берёт `riscv64gc`, а он ШЕСТИДЕСЯТИЧЕТЫРЁХБИТНЫЙ:
      # `AtomicU64` на нём есть, и класс «нет 64-битных атомиков» она пропустить обязана была по
      # построению. Из девяти целей потребителя CI держал ровно ту экзотику, которая этого поймать
      # не могла. Проверка была, покрытия не было, и по счётчикам разница не видна никак.
      #
      # Закон живёт в скрипте, а не здесь: `scripts/portable.sh` гоняется и руками до пуша. Две
      # копии одного критерия разошлись бы молча.
      - run: bash scripts/portable.sh

  docs:
    name: документация собирается
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `deny(rustdoc::broken_intra_doc_links)` стоит в крейтах: обещание ИМЕНИ в докблоке держит
      # компилятор, а не читатель. Здесь это обещание и проверяется.
      - run: cargo doc --workspace --no-deps
