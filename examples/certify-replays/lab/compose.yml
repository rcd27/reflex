# Стенд восьмого закона: движок пишет окно СВОЕЙ ленты на реальном трафике и предъявляет §10.
# Цензор здесь не нужен — закон о воспроизводимости решения, а не о находке; трафик берётся любой
# живой, чтобы буквы были настоящими, а не выдуманными стендом.
services:
  engine:
    build:
      context: ../../..
      dockerfile: examples/certify-replays/lab/engine/Dockerfile
    cap_add:
      - NET_ADMIN
    # Предпосылки КРАЯ: фасад читает счётчики и возраст потока у conntrack.
    sysctls:
      net.netfilter.nf_conntrack_acct: "1"
      net.netfilter.nf_conntrack_timestamp: "1"
    environment:
      TARGET: rutracker.org
      CONTROL: vk.com
