[package]
name = "detect-silent-drop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Use-case: поймать тихий дроп цели на NFQUEUE — эталон использования reflex"

# ЗАВИСИМОСТЬ ОДНА. Потребитель не тянет core/engine/linux по отдельности и не знает их имён —
# только `reflex`. Если для use-case'а понадобилось что-то ещё, это дефект фасада, а не примера.
[dependencies]
reflex = { path = "../../reflex" }
# ВИТРИНА НОСИТЕЛЯ WINDIVERT — `src/bin/windows.rs`. См. ниже, почему она здесь, а не отдельным
# крейтом, и почему `cfg(unix)` у соседей ниже обязателен.
reflex-windivert = { path = "../../windivert" }

# ЯДЕРНЫЙ РЕГРЕСС-СТЕНД (`edge_main.rs`, второй путь A/B, Task 10) берёт крейты напрямую — это
# стенд, не витрина фасада: он сравнивает юзерспейсный путь (через `reflex`) с ядерным
# (`QueueSocket` + `EdgeSilence`).
#
# `cfg(unix)`, И ЭТО НЕ ОПРЯТНОСТЬ, А ЗАМЕР (10.09.2026). Безусловными эти три строки делали крейт
# несобираемым под Windows: `reflex-linux` тянет `nfq`, чей `libc` расходится по `usize`/`i32` — 23
# ошибки, к WinDivert отношения не имеющие. Следствие было тихим и скверным: `bin/windows.rs`,
# ЕДИНСТВЕННАЯ витрина второго носителя, не проверялась кросс-сборкой ничем — не потому, что нет
# Windows, а потому, что крейт под неё не строился. Витрина «WinDivert встаёт в ту же дверь» стояла
# в доме, у которого под Windows не было пола.
#
# Два предмета в одном крейте — витрина фасада и стенд ядра — сами по себе законны (стенду нужен
# тот же трафик), но зависимости их обязаны быть разведены по платформам, иначе один делает второй
# непроверяемым.
# `reflex-core`/`reflex-instrument` БЕЗУСЛОВНЫ — они переносимы (кросс-сборка проходит), и витрина
# WinDivert сама ими пользуется. Под платформу уходит РОВНО тот, кто Linux и есть.
reflex-instrument = { path = "../../instrument" }
reflex-core = { path = "../../core" }

[target.'cfg(unix)'.dependencies]
reflex-linux = { path = "../../linux", features = ["nfqueue", "conntrack"] }
[[bin]]
name = "detect-silent-drop"
path = "src/main.rs"

[[bin]]
name = "detect-silent-drop-edge"
path = "src/edge_main.rs"

# ДИФФЕРЕНЦИАЛЬНЫЙ СТЕНД (Task 11): ОДНА цепочка фасада, ДВА носителя (`Nfqueue::queue`/`local`,
# выбор — переменной `CARRIER`) — оба движка на ОДНОМ трафике сверяются `lab/edges/compare.sh`.
# Зависит только от `reflex` (докблок `edges_main.rs`).
[[bin]]
name = "detect-silent-drop-edges"
path = "src/edges_main.rs"
