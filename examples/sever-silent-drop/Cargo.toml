[package]
name = "sever-silent-drop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Use-case ЭФФЕКТА: оборвать тихий дроп RST'ом по повтору — вместо вечной крутилки"

[dependencies]
reflex = { path = "../../reflex" }

[[bin]]
name = "sever-silent-drop"
path = "src/main.rs"

# ВТОРАЯ ФОРМА ТОГО ЖЕ ДЕЙСТВИЯ — правило вместо терминала. Второй бинарь, а не второй пример:
# предмет один («оборвать тихий дроп»), и разводить его по подпапкам значило бы прятать от
# читателя, что это выбор формы, а не выбор беды.
[[bin]]
name = "sever-in-a-set"
path = "src/in_a_set.rs"
