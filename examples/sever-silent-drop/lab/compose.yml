# Стенд sever-silent-drop: боевая верификация ЭФФЕКТА (инъекция RST) на реальном ТСПУ вантажа.
services:
  engine:
    build:
      context: ../../..
      dockerfile: examples/sever-silent-drop/lab/engine/Dockerfile
    cap_add:
      - NET_ADMIN
      # Инъекция RST идёт СВОИМ сырым сокетом, мимо очереди: без этого права она не уйдёт.
      - NET_RAW
    # Предпосылки КРАЯ: движок читает счётчики и возраст потока у conntrack. Ставятся здесь, а не
    # скриптом: /proc/sys в контейнере read-only, и docker кладёт их при создании netns.
    sysctls:
      net.netfilter.nf_conntrack_acct: "1"
      net.netfilter.nf_conntrack_timestamp: "1"
    environment:
      TARGET: rutracker.org
