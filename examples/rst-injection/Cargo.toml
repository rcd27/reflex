[package]
name = "example-rst-injection"
version = "0.0.1"
edition = "2021"
publish = false

[features]
default = []
tc = ["reflex-linux/tc", "dep:reflex-linux-common"]
nfqueue = ["reflex-linux/nfqueue"]

[dependencies]
reflex-core = { path = "../../core" }
reflex-linux = { path = "../../linux" }
reflex-linux-common = { path = "../../linux-common", optional = true }
futures = "0.3"
rand = "0.10"
smallvec = "1"
libc = "0.2"
tokio = { version = "1", features = ["time", "sync", "rt", "rt-multi-thread", "macros"] }

[[bin]]
name = "e2e_capture"
path = "capture.rs"

[[bin]]
name = "e2e_rst_emulator"
path = "emulator.rs"

[[bin]]
name = "e2e_rst_detector"
path = "detector.rs"

[[bin]]
name = "e2e_multi_disorder"
path = "multi_disorder.rs"

[[bin]]
name = "e2e_feedback_loop"
path = "feedback_loop.rs"

[[bin]]
name = "e2e_geneva_nfq"
path = "geneva_nfq.rs"
required-features = ["nfqueue"]

