[package]
name = "example-rst-injection"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
reflex-core = { path = "../../core" }
reflex-linux = { path = "../../linux" }
futures = "0.3"
tokio = { version = "1", features = ["time", "sync", "rt", "rt-multi-thread", "macros"] }

[[bin]]
name = "e2e_capture"
path = "capture.rs"

[[bin]]
name = "e2e_rst_emulator"
path = "emulator.rs"

[[bin]]
name = "e2e_rst_detector"
path = "detector.rs"

[[bin]]
name = "e2e_multi_disorder"
path = "strategy.rs"

[[bin]]
name = "e2e_feedback_loop"
path = "feedback_loop.rs"
