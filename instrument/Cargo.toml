[package]
name = "reflex-instrument"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Паспорт прибора: четыре множителя годности и их механическая проверка"

# ИМЯ ВЗЯТО У ПРЕДМЕТА, А НЕ ПЕРЕВЕДЕНО СЛОВАРЁМ (06.09.2026): главный тип крейта —
# `Instrument`, и модель, которую он проецирует, называется `model/law/Instrument.tla`. То есть
# английское имя здесь не новое, оно просто перестало расходиться с именем каталога.
#
# ПРЕФИКС `reflex-` ПРИШЁЛ ВМЕСТЕ С МЕСТОМ, и это не украшение: все пять соседей по фундаменту
# носят его, и крейт без префикса стал бы единственным исключением из правила, которое здесь
# больше ничем не держится. Имя следует за местом — оттого второе переименование за день, и цена
# его названа: около четырёхсот механических правок у потребителей.

# ГРАНИЦА ОСТАЛАСЬ ПРЕЖНЕЙ, НО СФОРМУЛИРОВАНА ТОЧНЕЕ.
#
# Крейт не имеет права знать ни одного типа РЕШЕНИЯ — ни страты, ни приказа, ни команды, ни беды
# продукта (`Distress`, `Finding`, `Sighting`). Зависимость строго односторонняя: домен →
# `instrument`, никогда обратно, и проверяет это компилятор, а не дисциплина.
#
# Прежняя редакция запрещала ВСЯКУЮ зависимость и держалась, пока крейт был только паспортом.
# С переездом детекции сюда запрет пришлось бы либо снять, либо соврать: разбирать провод, не
# зная, что такое TCP-сегмент, нельзя. Разбор — это ПРЕДМЕТ прибора, а не лечение: газоанализатор
# знает про газ (и про то, как устроен его датчик), но не знает, что делать при утечке.
#
# Отсюда правило, которое и надо сторожить: сюда можно тащить ЗНАНИЕ О МИРЕ (провод, протоколы,
# время) и нельзя тащить ЗНАНИЕ О НАС (что мы предпримем). Как только протечёт второе,
# отделимость приборов в собственный проект кончится молча.
[dependencies]
# РАЗБОР ПРОВОДА. Фичи перечислены явно: прибор, которому нужен ещё один протокол, добавляет его
# сюда — и это видно в манифесте, а не прячется в коде.
reflex-core = { path = "../core", features = ["tls", "dns", "pcap"] }
# СИГНАЛЫ ДЕТЕКТОРА. Тип из подписи `Detector::step`, а не наш выбор хранилища.
smallvec = "1"
