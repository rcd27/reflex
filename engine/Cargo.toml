[package]
name = "reflex-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Движок в разрыве: курсор разговора, окно темпа, момент раскрытия личности"

# ЧТО ЗДЕСЬ ФУНДАМЕНТ, А ЧТО БЫЛО БЫ ПРОДУКТОМ (06.09.2026, #326)
#
# Крейт знает, как устроен разговор в разрыве: когда он открылся, что о себе сказал, сколько байт
# унёс, пора ли выпускать его из горячего пути. Ни одного знания о ТСПУ, о наших стратах и о нашей
# схеме правил здесь нет и быть не может — то, что их знало, осталось наверху при разрезе
# (`nevod2-runtime::kernel`).
#
# `no_std` В КОДЕ, НО НЕ В СБОРКЕ, и это честнее назвать, чем оставить подразумеваемым: атрибут
# запрещает крейту тянуть `std` СОБСТВЕННЫМ кодом, но зависимости его тянут (`reflex-core` →
# `futures`). Под no_std-цель крейт сегодня не собрать; дисциплина стиля здесь реальна, свойство
# сборки — нет.
[dependencies]
# ПОДПИСЬ ДЕТЕКТОРА: сигналы приходят `SmallVec`, тип не наш выбор (#320).
smallvec = "1"
reflex-core = { path = "../core" }
# ПАСПОРТ ПРИБОРА — только типы и константы, ни одной аллокации и ни одной зависимости.
# Плоскость performance-first, и цена здесь нулевая: всё вычисляется компилятором.
reflex-instrument = { path = "../instrument" }
